services:
  chroma:
    image: chromadb/chroma:latest
    container_name: internship-agent-chroma
    ports:
      - "6333:8000"
    volumes:
      - chroma-data:/data
      - ./docker/chroma-config.yaml:/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && echo -e \"GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  chroma-data:
